<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Gestión</title>
<style>
:root{--bg:#f5f2ec;--cd:#fff;--tx:#2a2420;--mu:#6f655a;--ac:#2f5d50;--ok:#2e7d32;--wa:#b35f00;--er:#b3261e;--bd:#e2dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

:root[data-theme=dark]{--bg:#1f1b18;--cd:#2a2521;--tx:#efe8dc;--mu:#a99f92;--ac:#7fc4b0;--ok:#7bd08a;--wa:#f0a858;--er:#ff8a80;--bd:#3d362f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#app{padding:14px 14px 96px;max-width:640px;margin:0 auto}

.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.c small,.mu{color:var(--mu)}.r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big{font-size:28px;font-weight:700}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.b1{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.b2{background:transparent}
.s{min-height:38px;padding:6px 10px;font-size:14px;margin:6px 6px 0 0}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;padding:8px 2px}nav button.on{color:var(--ac);font-weight:700}
nav span{display:block;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
label{display:block;margin:8px 0;font-size:14px;color:var(--mu)}input,select,textarea{display:block;width:100%;font:inherit;padding:11px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}.done{text-decoration:line-through;opacity:.6}
#t{position:fixed;left:12px;right:12px;bottom:84px;background:#222;color:#fff;padding:12px;border-radius:10px;z-index:10;display:none}
</style></head><body>
<div id="app"></div><datalist id="nm"></datalist><div id="t"></div>
<nav><button data-t="inicio"><span>🏠</span>Inicio</button><button data-t="citas"><span>📅</span>Citas</button><button data-t="compras"><span>🛒</span>Compras</button><button data-t="prov"><span>🏢</span>Proveedores</button><button data-t="ajustes"><span>⚙️</span>Ajustes</button></nav>
<script>
const K='gestion_v1';let S={citas:[],compras:[],prov:[],fact:[],pagos:[],nombres:[],ult:'',cfg:{fav:['7','3','1','0']}},T='inicio',D=null,ALL=false;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const save=()=>{clearTimeout(save.t);save.t=setTimeout(plan,600);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador. Crea una copia de seguridad.')}};
const eur=n=>(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),r2=n=>Math.round(n*100)/100;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)},hoy=()=>add(0),fd=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',3500)};
const pagado=f=>S.pagos.filter(p=>p.fa===f.id).reduce((a,p)=>a+p.imp,0),pend=f=>r2(f.imp-pagado(f));
const est=f=>pend(f)<=0?'Pagada':f.fv<hoy()?'Vencida':pagado(f)>0?'Parcial':'Pendiente';
const bd=e=>({Pagada:'<b class="ok">✔ Pagada</b>',Vencida:'<b class="er">⚠ Vencida</b>',Parcial:'<b class="wa">◐ Parcial</b>',Pendiente:'<b class="wa">● Pendiente</b>',pendiente:'<b class="wa">● Pendiente</b>',realizada:'<b class="ok">✔ Realizada</b>',cancelada:'<b class="gr">✖ Cancelada</b>'})[e];
const pn=id=>(S.prov.find(p=>p.id===id)||{n:'(proveedor eliminado)'}).n,ant=p=>S.pagos.filter(x=>x.p===p&&!x.fa&&x.tipo==='cuenta');
const sum=a=>r2(a.reduce((x,y)=>x+y,0));
function ask(msg,yes,lbl){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><p>'+esc(msg)+'</p><div class="row"><button class="b2" id="n">Cancelar</button><button class="b1" id="y">'+(lbl||'Confirmar')+'</button></div></div>';document.body.appendChild(m);m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{m.remove();yes()}}
function form(title,fields,vals,ok){const m=document.createElement('div');m.className='modal';
m.innerHTML='<form class="sheet" id="fm"><h2>'+title+'</h2>'+fields.map(f=>{const v=vals[f.k]??'';let i;
if(f.t==='chk')i=f.o.map(o=>'<label style="display:flex;gap:10px;align-items:center;color:var(--tx);margin:4px 0"><input type="checkbox" name="'+f.k+'" value="'+o[0]+'" style="width:24px;height:24px;margin:0"'+((vals[f.k]||[]).includes(o[0])?' checked':'')+'> '+o[1]+'</label>').join('');else if(f.t==='select')i='<select name="'+f.k+'">'+f.o.map(o=>{const a=Array.isArray(o)?o:[o,o];return '<option value="'+esc(a[0])+'"'+(a[0]==v?' selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select>';
else if(f.t==='area')i='<textarea name="'+f.k+'" rows="3">'+esc(v)+'</textarea>';
else i='<input name="'+f.k+'" type="'+(f.t||'text')+'"'+(f.t==='number'?' step="0.01" inputmode="decimal"':'')+(f.dl?' list="nm" autocomplete="off"':'')+' value="'+esc(v)+'"'+(f.r?' required':'')+'>';
return f.t==='chk'?'<div style="margin:8px 0"><div class="mu" style="font-size:14px">'+f.l+'</div>'+i+'</div>':'<label>'+f.l+i+'</label>'}).join('')+'<div class="row"><button type="button" class="b2" id="cx">Cancelar</button><button class="b1">Guardar</button></div></form>';
document.body.appendChild(m);m.querySelector('#cx').onclick=()=>m.remove();
m.querySelector('form').onsubmit=e=>{e.preventDefault();const fdt=new FormData(e.target),o=Object.fromEntries(fdt);fields.forEach(f=>{if(f.t==='chk')o[f.k]=fdt.getAll(f.k);if(f.t==='number')o[f.k]=parseFloat(String(o[f.k]).replace(',','.'))});if(ok(o)!==false)m.remove()}}
const done=()=>{save();render()};
function fCita(c){form(c?'Editar cita':'Nueva cita',[{k:'t',l:'Título',r:1},{k:'tipo',l:'Tipo',t:'select',o:[['personal','Personal'],['profesional','Profesional']]},{k:'f',l:'Fecha',t:'date',r:1},{k:'h',l:'Hora de inicio',t:'time'},{k:'hf',l:'Hora de fin (opcional)',t:'time'},{k:'lugar',l:'Lugar'},{k:'cont',l:'Contacto'},{k:'tel',l:'Teléfono',t:'tel'},{k:'notas',l:'Notas',t:'area'},{k:'av',l:'Recordatorios (con sonido y vibración)',t:'chk',o:[['7d','Una semana antes'],['3d','Tres días antes'],['1d','Un día antes'],['0','El mismo día (8:00)'],['1h','Una hora antes (si hay hora)'],['cp','Personalizado (fecha y hora de abajo)']]},{k:'cpf',l:'Aviso personalizado: fecha',t:'date'},{k:'cph',l:'Aviso personalizado: hora',t:'time'}],c||{tipo:'personal',av:['1d','1h']},o=>{if(c)Object.assign(c,o);else S.citas.push({id:uid(),est:'pendiente',...o});done()})}
function fComp(c){form(c?'Editar producto':'Añadir compra',[{k:'n',l:'Producto',r:1,dl:1},{k:'cant',l:'Cantidad'},{k:'obs',l:'Observaciones'}],c||{},o=>{if(c)Object.assign(c,o);else S.compras.push({id:uid(),comprado:false,alta:hoy(),...o});if(o.n&&!S.nombres.includes(o.n))S.nombres.push(o.n);done()})}
function fProv(p){form(p?'Editar proveedor':'Nuevo proveedor',[{k:'n',l:'Nombre comercial',r:1},{k:'fis',l:'Nombre fiscal'},{k:'cif',l:'CIF/NIF'},{k:'tel',l:'Teléfono',t:'tel'},{k:'mail',l:'Correo',t:'email'},{k:'dir',l:'Dirección y localidad'},{k:'obs',l:'Observaciones',t:'area'}],p||{},o=>{if(p)Object.assign(p,o);else{const n={id:uid(),...o};S.prov.push(n);D=n.id}done()})}
const pops=()=>S.prov.map(p=>[p.id,p.n]);
function fFact(f){if(!S.prov.length)return toast('Primero crea un proveedor.');form(f?'Editar factura':'Nueva factura',[{k:'p',l:'Proveedor',t:'select',o:pops()},{k:'ref',l:'Número o referencia (opcional)'},{k:'ff',l:'Fecha de factura',t:'date',r:1},{k:'fv',l:'Fecha de vencimiento',t:'date',r:1},{k:'imp',l:'Importe total (€)',t:'number',r:1},{k:'obs',l:'Concepto',t:'area'}],f||{p:D||S.prov[0].id,ff:hoy()},o=>{if(!(o.imp>0)){toast('El importe debe ser mayor que 0.');return false}if(o.fv<o.ff){toast('El vencimiento no puede ser anterior a la factura.');return false}if(f)Object.assign(f,o);else S.fact.push({id:uid(),...o});done()})}
function fPago(pre){if(!S.prov.length)return toast('Primero crea un proveedor.');const fo=[['','Sin asignar (entrega a cuenta)'],...S.fact.filter(f=>pend(f)>0).map(f=>[f.id,pn(f.p)+' · '+(f.ref||fd(f.ff))+' · pendiente '+eur(pend(f))])];
form('Registrar pago',[{k:'p',l:'Proveedor',t:'select',o:pops()},{k:'tipo',l:'Tipo',t:'select',o:[['pago','Pago de factura / pago parcial'],['cuenta','Entrega a cuenta']]},{k:'fa',l:'Factura',t:'select',o:fo},{k:'f',l:'Fecha del pago',t:'date',r:1},{k:'imp',l:'Importe (€)',t:'number',r:1},{k:'forma',l:'Forma de pago'},{k:'obs',l:'Observaciones'}],{p:D||S.prov[0].id,f:hoy(),tipo:'pago',...(pre||{})},o=>{
if(!(o.imp>0)){toast('El importe debe ser mayor que 0.');return false}
const fa=S.fact.find(x=>x.id===o.fa);if(o.tipo==='pago'&&!fa){toast('Elige la factura que se paga.');return false}
if(fa)o.p=fa.p;const go=()=>{S.pagos.push({id:uid(),...o});done()};
const dup=S.pagos.some(x=>x.p===o.p&&x.f===o.f&&x.imp===o.imp&&x.fa===o.fa);
const chk=()=>fa&&o.imp>pend(fa)?ask('El pago ('+eur(o.imp)+') supera el saldo pendiente ('+eur(pend(fa))+'). ¿Registrarlo igualmente?',go):go();
if(dup)ask('Ya existe un pago igual (mismo proveedor, fecha e importe). ¿Registrarlo de todos modos?',chk);else chk();return true})}
const A={nc:()=>fCita(),ec:i=>fCita(S.citas.find(x=>x.id===i)),cs:(i,v)=>{S.citas.find(x=>x.id===i).est=v;done()},dc:i=>ask('¿Eliminar esta cita?',()=>{S.citas=S.citas.filter(x=>x.id!==i);done()},'Eliminar'),
nb:()=>fComp(),eb:i=>fComp(S.compras.find(x=>x.id===i)),tb:i=>{const c=S.compras.find(x=>x.id===i);c.comprado=!c.comprado;done()},db:i=>ask('¿Eliminar este producto de forma definitiva?',()=>{S.compras=S.compras.filter(x=>x.id!==i);done()},'Eliminar'),
dcb:()=>ask('¿Eliminar de forma definitiva todos los productos comprados?',()=>{S.compras=S.compras.filter(x=>!x.comprado);done()},'Eliminar'),
np:()=>{T='prov';fProv()},vp:i=>{D=i;T='prov';render()},ep:i=>fProv(S.prov.find(x=>x.id===i)),bk2:()=>{D=null;render()},
dp:i=>{const nf=S.fact.filter(f=>f.p===i).length,np=S.pagos.filter(x=>x.p===i).length;ask('Se eliminará el proveedor junto con '+nf+' factura(s) y '+np+' pago(s). Esta acción no se puede deshacer.',()=>{S.fact=S.fact.filter(f=>f.p!==i);S.pagos=S.pagos.filter(x=>x.p!==i);S.prov=S.prov.filter(x=>x.id!==i);D=null;done()},'Eliminar todo')},
nf:()=>{T='prov';fFact()},ef:i=>fFact(S.fact.find(x=>x.id===i)),df:i=>{const n=S.pagos.filter(x=>x.fa===i).length;ask('Se eliminará la factura y sus '+n+' pago(s) asociados.',()=>{S.pagos=S.pagos.filter(x=>x.fa!==i);S.fact=S.fact.filter(f=>f.id!==i);done()},'Eliminar')},
npg:()=>fPago(),pp:i=>fPago({fa:i,tipo:'pago',p:S.fact.find(x=>x.id===i).p}),dpg:i=>ask('¿Eliminar este pago? Se recalcularán los saldos.',()=>{S.pagos=S.pagos.filter(x=>x.id!==i);done()},'Eliminar'),
ap:i=>{const a=S.pagos.find(x=>x.id===i),fs=S.fact.filter(f=>f.p===a.p&&pend(f)>0);if(!fs.length)return toast('No hay facturas pendientes de este proveedor.');form('Aplicar anticipo de '+eur(a.imp),[{k:'fa',l:'Factura',t:'select',o:fs.map(f=>[f.id,(f.ref||fd(f.ff))+' · pendiente '+eur(pend(f))])}],{},o=>{const f=S.fact.find(x=>x.id===o.fa),go=()=>{a.fa=f.id;a.tipo='pago';done()};a.imp>pend(f)?ask('El anticipo supera el saldo de la factura. ¿Aplicarlo igualmente?',go):go()})},
bk:()=>backup(),ex:()=>exportar(),perm:async()=>{const L=nat('LocalNotifications');if(!L)return toast('Los avisos solo funcionan en la app instalada.');const p=await L.requestPermissions();toast(p.display==='granted'?'Avisos permitidos.':'Avisos bloqueados. Actívalos en Ajustes del móvil > Apps > Mi Gestión > Notificaciones.')},test:async()=>{const L=nat('LocalNotifications');if(!L)return toast('Los avisos solo funcionan en la app instalada.');await L.schedule({notifications:[{id:hid('test'+Date.now()),title:'Aviso de prueba',body:'Si lo oyes y lo ves, los avisos funcionan.',schedule:{at:new Date(Date.now()+8000),allowWhileIdle:true},channelId:'avisos',actionTypeId:'AV',extra:{t:'inicio'}}]});toast('Cierra la app: sonará en unos 8 segundos.')},cfgf:()=>form('Avisos de facturas',[{k:'fav',l:'Avisar de los vencimientos',t:'chk',o:[['7','Siete días antes'],['3','Tres días antes'],['1','El día anterior'],['0','El mismo día']]}],S.cfg,o=>{S.cfg.fav=o.fav;done()}),vf:i=>{T='prov';D=S.fact.find(x=>x.id===i).p;render()},ct:i=>{T=i;D=null;ALL=false;render()},all:()=>{ALL=!ALL;render()}};
const cita=c=>'<div class="c"><div class="r"><b>'+esc(c.t)+'</b>'+bd(c.est)+'</div><div>'+fd(c.f)+(c.h?' · '+c.h+(c.hf?'–'+c.hf:''):'')+' · '+c.tipo+'</div>'+(c.lugar?'<small>📍 '+esc(c.lugar)+'</small><br>':'')+(c.cont||c.tel?'<small>'+esc(c.cont||'')+' '+(c.tel?'<a href="tel:'+esc(c.tel)+'">'+esc(c.tel)+'</a>':'')+'</small><br>':'')+(c.notas?'<small>'+esc(c.notas)+'</small><br>':'')+
'<button class="s" data-a="cs" data-i="'+c.id+'" data-v="realizada">Hecha</button><button class="s" data-a="cs" data-i="'+c.id+'" data-v="cancelada">Cancelar</button><button class="s" data-a="ec" data-i="'+c.id+'">Editar</button><button class="s" data-a="dc" data-i="'+c.id+'">Borrar</button></div>';
const fac=(f,acc)=>'<div class="c"><div class="r"><b>'+esc(pn(f.p))+'</b>'+bd(est(f))+'</div><div>'+(f.ref?esc(f.ref)+' · ':'')+'Vence '+fd(f.fv)+'</div><div>Total '+eur(f.imp)+' · Pagado '+eur(pagado(f))+' · <b>Pendiente '+eur(pend(f))+'</b></div>'+(acc?'<button class="s" data-a="pp" data-i="'+f.id+'">Registrar pago</button><button class="s" data-a="ef" data-i="'+f.id+'">Editar</button><button class="s" data-a="df" data-i="'+f.id+'">Borrar</button>':'')+'</div>';
const empty=m=>'<div class="c mu">'+m+'</div>';
function inicio(){const h=hoy(),s7=add(7),pc=S.citas.filter(c=>c.est==='pendiente'),hc=pc.filter(c=>c.f===h),pr=pc.filter(c=>c.f>h&&c.f<=s7),at=pc.filter(c=>c.f<h),fp=S.fact.filter(f=>pend(f)>0),ven=fp.filter(f=>f.fv<h),prx=fp.filter(f=>f.fv>=h&&f.fv<=s7),np=S.compras.filter(c=>!c.comprado).length,an=sum(S.prov.flatMap(p=>ant(p.id).map(x=>x.imp)));
const old=!S.ult||(new Date(h)-new Date(S.ult))/864e5>30;
return '<h2>Inicio</h2><div class="g"><button class="b1" data-a="nc">+ Nueva cita</button><button class="b1" data-a="nb">+ Añadir compra</button><button class="b1" data-a="np">+ Nuevo proveedor</button><button class="b1" data-a="nf">+ Nueva factura</button><button class="b1" data-a="npg">+ Registrar pago</button><button data-a="ex">Exportar datos</button></div>'+
'<h3>Citas</h3>'+(at.length?'<div class="c er"><b>⚠ '+at.length+' cita(s) atrasada(s) sin completar</b></div>':'')+(hc.length?hc.map(cita).join(''):empty('No tienes citas para hoy'))+'<div class="c" data-a="ct" data-i="citas"><b>Próximos 7 días:</b> '+(pr.length?pr.length+' cita(s)':'ninguna')+(pr.length?'<br>'+pr.map(c=>'<small>'+fd(c.f)+' '+(c.h||'')+' · '+esc(c.t)+'</small>').join('<br>'):'')+'</div>'+
'<h3>Compras</h3><div class="c" data-a="ct" data-i="compras"><span class="big">'+np+'</span> producto(s) pendiente(s)</div>'+
'<h3>Proveedores y pagos</h3><div class="c" data-a="ct" data-i="prov"><div class="big">'+eur(sum(fp.map(pend)))+'</div>pendiente de pago · '+new Set(fp.map(f=>f.p)).size+' proveedor(es)'+(an?'<br><small>Anticipos disponibles: '+eur(an)+'</small>':'')+'</div>'+
(ven.length?'<div class="c er"><b>⚠ Facturas vencidas</b></div>'+ven.map(f=>fac(f,0).replace('class="c"','class="c" data-a="vf" data-i="'+f.id+'"')).join(''):'')+(prx.length?'<div class="c wa"><b>● Vencen en los próximos 7 días</b></div>'+prx.map(f=>fac(f,0).replace('class="c"','class="c" data-a="vf" data-i="'+f.id+'"')).join(''):'')+(!fp.length?empty('No tienes facturas pendientes'):'')+
'<h3>Últimos pagos</h3>'+(S.pagos.length?S.pagos.slice().sort((a,b)=>b.f.localeCompare(a.f)).slice(0,4).map(x=>'<div class="c r"><span>'+fd(x.f)+' · '+esc(pn(x.p))+'</span><b>'+eur(x.imp)+'</b></div>').join(''):empty('Aún no hay pagos registrados'))+
'<h3>Copia de seguridad</h3><div class="c '+(old?'wa':'ok')+'" data-a="bk">'+(old?'⚠ '+(S.ult?'La última copia tiene más de 30 días ('+fd(S.ult)+')':'Todavía no has creado ninguna copia')+'. Toca para crear una.':'✔ Última copia creada: '+fd(S.ult))+'</div>'}
function citas(){const l=S.citas.filter(c=>ALL||c.est==='pendiente').sort((a,b)=>(a.f+(a.h||'')).localeCompare(b.f+(b.h||'')));return '<h2>Citas</h2><button class="b1" data-a="nc" style="width:100%">+ Nueva cita</button><button class="s" data-a="all">'+(ALL?'Ver solo pendientes':'Ver todas')+'</button>'+(l.length?l.map(cita).join(''):empty('No tienes citas pendientes'))}
function compras(){const p=S.compras.filter(c=>!c.comprado),c=S.compras.filter(x=>x.comprado),it=x=>'<div class="c r"><span class="'+(x.comprado?'done':'')+'"><input type="checkbox" style="display:inline;width:24px;height:24px;vertical-align:middle" '+(x.comprado?'checked':'')+' data-a="tb" data-i="'+x.id+'"> '+esc(x.n)+(x.cant?' <small>('+esc(x.cant)+')</small>':'')+'</span><span><button class="s" data-a="eb" data-i="'+x.id+'">✎</button><button class="s" data-a="db" data-i="'+x.id+'">🗑</button></span></div>';
return '<h2>Compras</h2><form id="qa" class="r"><input id="qn" list="nm" autocomplete="off" placeholder="Producto…" required><button class="b1">Añadir</button></form><h3>Pendientes ('+p.length+')</h3>'+(p.length?p.map(it).join(''):empty('No tienes compras pendientes'))+(c.length?'<h3>Comprados</h3>'+c.map(it).join('')+'<button class="s" data-a="dcb">Eliminar todos los comprados</button>':'')}
function prov(){if(D){const p=S.prov.find(x=>x.id===D);if(!p){D=null;return prov()}const fs=S.fact.filter(f=>f.p===D).sort((a,b)=>a.fv.localeCompare(b.fv)),ps=S.pagos.filter(x=>x.p===D).sort((a,b)=>b.f.localeCompare(a.f)),aa=ant(D),deuda=sum(fs.map(pend).filter(x=>x>0)),av=sum(aa.map(x=>x.imp));
return '<button class="s" data-a="bk2">← Volver</button><h2>'+esc(p.n)+'</h2><div class="c"><small>'+esc([p.fis,p.cif,p.tel,p.mail,p.dir].filter(Boolean).join(' · '))+'</small><br><small>'+esc(p.obs||'')+'</small><div>Deuda por facturas: <b>'+eur(deuda)+'</b></div><div>Anticipos disponibles: <b>'+eur(av)+'</b></div><div>Saldo neto: <b>'+eur(r2(deuda-av))+'</b></div><button class="s" data-a="ep" data-i="'+D+'">Editar</button><button class="s" data-a="dp" data-i="'+D+'">Eliminar</button></div><button class="b1" data-a="nf">+ Factura</button> <button class="b1" data-a="npg">+ Pago</button><h3>Facturas</h3>'+(fs.length?fs.map(f=>fac(f,1)).join(''):empty('Sin facturas'))+
(aa.length?'<h3>Anticipos sin asignar</h3>'+aa.map(x=>'<div class="c r"><span>'+fd(x.f)+' · '+eur(x.imp)+'</span><button class="s" data-a="ap" data-i="'+x.id+'">Aplicar a factura</button></div>').join(''):'')+'<h3>Historial de pagos</h3>'+(ps.length?ps.map(x=>'<div class="c r"><span>'+fd(x.f)+' · '+(x.fa?'pago':'a cuenta')+(x.forma?' · '+esc(x.forma):'')+'</span><span><b>'+eur(x.imp)+'</b> <button class="s" data-a="dpg" data-i="'+x.id+'">🗑</button></span></div>').join(''):empty('Sin pagos'))}
return '<h2>Proveedores</h2><button class="b1" data-a="np" style="width:100%">+ Nuevo proveedor</button><button class="s" data-a="nf">+ Factura</button><button class="s" data-a="npg">+ Pago</button>'+(S.prov.length?S.prov.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(p=>{const d=sum(S.fact.filter(f=>f.p===p.id).map(pend).filter(x=>x>0));return '<div class="c r" data-a="vp" data-i="'+p.id+'"><b>'+esc(p.n)+'</b><span class="'+(d?'wa':'ok')+'">'+(d?'● '+eur(d):'✔ Sin deuda')+'</span></div>'}).join(''):empty('No tienes proveedores todavía'))}
function ajustes(){return '<h2>Ajustes</h2><div class="c"><b>Copias de seguridad</b><p class="mu">Tus datos se guardan solo en este navegador del móvil. Si borras los datos del navegador o cambias de móvil, se pierden. Crea copias con frecuencia y guárdalas en Drive, correo, etc.</p><div class="g"><button class="b1" data-a="bk">Crear copia</button><button id="rs">Restaurar copia</button></div><input type="file" id="fl" accept=".json" hidden><p class="mu">'+(S.ult?'Última copia creada: '+fd(S.ult):'Sin copias todavía.')+'</p></div><div class="c"><b>Exportar</b><p class="mu">Archivo de texto legible con citas, compras, facturas y pagos.</p><button data-a="ex" style="width:100%">Exportar datos (.txt)</button></div><div class="c"><b>Avisos y alarmas</b><p class="mu">Suenan y vibran aunque la app esté cerrada. Para que Android no los bloquee, quita la optimización de batería de esta app (Ajustes del móvil > Apps > Mi Gestión > Batería > Sin restricciones).</p><div class="g"><button data-a="perm">Comprobar permisos</button><button data-a="test">Aviso de prueba</button></div><button data-a="cfgf" style="width:100%;margin-top:8px">Avisos de facturas</button></div>'}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===T));$('#nm').innerHTML=S.nombres.map(n=>'<option value="'+esc(n)+'">').join('');$('#app').innerHTML=({inicio,citas,compras,prov,ajustes})[T]()}
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(16)};
const pack=()=>JSON.stringify({citas:S.citas,compras:S.compras,prov:S.prov,fact:S.fact,pagos:S.pagos,nombres:S.nombres,cfg:S.cfg});
async function guardar(name,txt,type){const C=nat('Filesystem'),H=nat('Share');if(C&&H){try{const r=await C.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await H.share({title:name,files:[r.uri]});return true}catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('No se pudo crear el archivo.');return false}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();return true}
async function backup(){const data=pack(),out=JSON.stringify({app:'mi-gestion',v:1,fecha:new Date().toISOString(),sum:hash(data),data});if(await guardar('copia-gestion-'+hoy()+'.json',out,'application/json')){S.ult=hoy();done();toast('Copia creada. Guárdala en un sitio seguro.')}}
async function exportar(){const L=['RESUMEN GENERAL ('+fd(hoy())+')','','CITAS PENDIENTES'];S.citas.filter(c=>c.est==='pendiente').sort((a,b)=>a.f.localeCompare(b.f)).forEach(c=>L.push('- '+fd(c.f)+' '+(c.h||'')+' · '+c.t+(c.lugar?' · '+c.lugar:'')));L.push('','COMPRAS PENDIENTES');S.compras.filter(c=>!c.comprado).forEach(c=>L.push('- '+c.n+(c.cant?' ('+c.cant+')':'')));L.push('','FACTURAS Y PAGOS');
S.prov.forEach(p=>{L.push('','Proveedor: '+p.n);S.fact.filter(f=>f.p===p.id).forEach(f=>{L.push('  Factura: '+(f.ref||'s/n')+' · '+fd(f.ff)+' · vence '+fd(f.fv),'  Importe total: '+eur(f.imp));S.pagos.filter(x=>x.fa===f.id).forEach(x=>L.push('    Pago '+fd(x.f)+': '+eur(x.imp)));L.push('  Total pagado: '+eur(pagado(f)),'  Pendiente: '+eur(pend(f)),'  Estado: '+est(f),'')});ant(p.id).forEach(x=>L.push('  Entrega a cuenta sin asignar '+fd(x.f)+': '+eur(x.imp)))});
L.push('','TOTAL PENDIENTE DE PAGO: '+eur(sum(S.fact.map(pend).filter(x=>x>0))));await guardar('resumen-'+hoy()+'.txt',L.join('\n'),'text/plain')}
document.addEventListener('click',e=>{const t=e.target.closest('nav button');if(t){T=t.dataset.t;D=null;ALL=false;render();return}if(e.target.id==='rs'){$('#fl').click();return}const b=e.target.closest('[data-a]');if(!b||b.type==='checkbox'&&e.type!=='click')return;A[b.dataset.a](b.dataset.i,b.dataset.v)});
document.addEventListener('submit',e=>{if(e.target.id!=='qa')return;e.preventDefault();const n=$('#qn').value.trim();if(!n)return;S.compras.push({id:uid(),n,comprado:false,alta:hoy()});if(!S.nombres.includes(n))S.nombres.push(n);done()});
document.addEventListener('change',async e=>{if(e.target.id!=='fl')return;const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='mi-gestion'||typeof o.data!=='string'||hash(o.data)!==o.sum)throw 0;const d=JSON.parse(o.data);ask('Copia del '+new Date(o.fecha).toLocaleDateString('es-ES')+': '+d.citas.length+' citas, '+d.compras.length+' compras, '+d.prov.length+' proveedores, '+d.fact.length+' facturas, '+d.pagos.length+' pagos. Se REEMPLAZARÁN los datos actuales. Te recomiendo crear antes una copia de los datos actuales.',()=>{S=Object.assign({citas:[],compras:[],prov:[],fact:[],pagos:[],nombres:[],ult:S.ult,cfg:S.cfg},d);done();toast('Copia restaurada.')},'Reemplazar datos')}catch(x){toast('El archivo está dañado o no es una copia válida. Tus datos actuales no se han tocado.')}});
const nat=n=>{try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins[n]}catch(e){return null}};
const hid=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1};
const dt=(f,t,off)=>{const[y,m,d]=f.split('-').map(Number),[H,M]=t.split(':').map(Number);return new Date(y,m-1,d-off,H,M)};
async function plan(){const L=nat('LocalNotifications');if(!L)return;try{const p=await L.getPending(),old=p.notifications.filter(n=>!(n.extra&&n.extra.snooze)).map(n=>({id:n.id}));if(old.length)await L.cancel({notifications:old});
const out=[],now=Date.now(),put=(k,w,title,body,extra)=>{if(w&&w.getTime()>now+5000)out.push({id:hid(k),title,body,schedule:{at:w,allowWhileIdle:true},channelId:'avisos',actionTypeId:'AV',extra})};
S.citas.filter(c=>c.est==='pendiente').forEach(c=>(c.av||[]).forEach(a=>{let w=null;if(['7d','3d','1d'].includes(a))w=dt(c.f,c.h||'09:00',parseInt(a));else if(a==='0')w=dt(c.f,'08:00',0);else if(a==='1h'&&c.h)w=new Date(dt(c.f,c.h,0).getTime()-36e5);else if(a==='cp'&&c.cpf)w=dt(c.cpf,c.cph||'09:00',0);put('c:'+c.id+':'+a,w,c.t,fd(c.f)+(c.h?' '+c.h:'')+(c.lugar?' · '+c.lugar:''),{t:'citas'})}));
S.fact.filter(f=>pend(f)>0).forEach(f=>(S.cfg.fav||[]).forEach(a=>put('f:'+f.id+':'+a,dt(f.fv,'09:00',+a),a==='0'?'Factura vence hoy':'Factura vence en '+a+' día(s)',pn(f.p)+' · pendiente '+eur(pend(f))+(f.ref?' · '+f.ref:''),{t:'prov',p:f.p})));
if(out.length)await L.schedule({notifications:out})}catch(e){}}
function nativeInit(){const L=nat('LocalNotifications');if(!L)return;
L.createChannel({id:'avisos',name:'Avisos de citas y pagos',importance:5,vibration:true,visibility:1}).catch(()=>{});
L.registerActionTypes({types:[{id:'AV',actions:[{id:'posponer',title:'Posponer 1 h'},{id:'descartar',title:'Descartar'},{id:'abrir',title:'Abrir',foreground:true}]}]}).catch(()=>{});
L.addListener('localNotificationActionPerformed',e=>{const n=e.notification,x=n.extra||{};if(e.actionId==='posponer')L.schedule({notifications:[{id:hid('sn:'+Date.now()),title:n.title,body:n.body,schedule:{at:new Date(Date.now()+36e5),allowWhileIdle:true},channelId:'avisos',actionTypeId:'AV',extra:{...x,snooze:true}}]});else if(e.actionId!=='descartar'){T=x.t||'inicio';D=x.p||null;render()}});
L.checkPermissions().then(p=>{if(p.display!=='granted')L.requestPermissions()}).catch(()=>{});plan()}
render();nativeInit();
</script></body></html>
